<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Challenge - 23 July 2026 - Test Bazar</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
--primary: #1a7a4a;
--primary-hover: #2aad68;
--accent: #f9a825;
--bg-main: #f0faf4;
--bg-card: #ffffff;
--text-main: #1c2e24;
--text-meta: #5a7a66;
--border-color: #c5dccb;
--success: #1a7a4a;
--danger: #dc3545;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Syne', sans-serif; background: var(--bg-main); color: var(--text-main); min-height: 100vh; }
.bn-font { font-family: 'Tiro Bangla', serif; }

.navbar { background: var(--primary); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; color: white; box-shadow: 0 4px 20px rgba(26, 122, 74, 0.15); position: sticky; top: 0; z-index: 100; }
.logo { font-size: 1.6rem; font-weight: 800; letter-spacing: 1px; cursor: pointer; color: white; }
.logo span { color: var(--accent); }
.back-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 16px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.3s; font-family: 'Tiro Bangla', serif; }
.back-btn:hover { background: var(--accent); color: var(--primary); }

.container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }

.header-banner { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white; border-radius: 16px; padding: 1.5rem 2rem; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: 0 10px 30px rgba(26,122,74,0.25); }
.header-banner-left h1 { font-family: 'Tiro Bangla', serif; font-size: 1.6rem; font-weight: 800; margin-bottom: 5px; }
.header-banner-left p { font-family: 'Tiro Bangla', serif; font-size: 1rem; opacity: 0.95; }
.header-banner .q-count { background: var(--accent); color: var(--primary); padding: 10px 20px; border-radius: 12px; font-family: 'Tiro Bangla', serif; font-weight: 800; font-size: 1.1rem; }

.q-card { background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 5px 20px rgba(26,122,74,0.05); margin-bottom: 25px; border: 2px solid var(--border-color); }
.q-num { font-size: 1.05rem; font-weight: 800; color: var(--primary); margin-bottom: 1.2rem; border-bottom: 2px dashed var(--border-color); padding-bottom: 10px; display: flex; justify-content: space-between; }
.q-tag { background: var(--bg-main); color: var(--primary); padding: 3px 10px; border-radius: 50px; font-size: 0.85rem; font-family: 'Tiro Bangla', serif; }
.q-text { font-family: 'Tiro Bangla', serif; font-size: 1.35rem; color: var(--text-main); font-weight: 700; line-height: 1.6; margin-bottom: 1.8rem; }
.opts { display: grid; grid-template-columns: 1fr; gap: 1rem; }
@media (min-width: 650px) { .opts { grid-template-columns: 1fr 1fr; } }
.opt { display: flex; align-items: flex-start; gap: 15px; padding: 1.2rem; border: 2px solid var(--border-color); border-radius: 12px; background: #fdfdfd; cursor: pointer; transition: all 0.2s; }
.opt:hover { border-color: var(--primary-hover); background: var(--bg-main); }
.opt.selected { border-color: var(--primary); background: var(--bg-main); }
.opt-circle { min-width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: var(--text-meta); flex-shrink: 0; background: white; transition: 0.2s; }
.opt-text { font-family: 'Tiro Bangla', serif; font-size: 1.15rem; color: var(--text-main); line-height: 1.5; font-weight: 600; padding-top: 2px; }
.opt.selected .opt-circle { background: var(--primary); border-color: var(--primary); color: white; }
.opt.correct { border-color: var(--success) !important; background: #f0fdf4 !important; }
.opt.correct .opt-circle { background: var(--success) !important; border-color: var(--success) !important; color: white !important; }
.opt.wrong { border-color: var(--danger) !important; background: #fef2f2 !important; }
.opt.wrong .opt-circle { background: var(--danger) !important; border-color: var(--danger) !important; color: white !important; }
.explanation { background: var(--bg-main); border-left: 6px solid var(--primary); border-radius: 0 10px 10px 0; padding: 1.5rem; margin-top: 2rem; display: none; }
.explanation.show { display: block; }
.explanation p { font-family: 'Tiro Bangla', serif; font-size: 1.1rem; color: var(--text-main); line-height: 1.7; }
.explanation strong { color: var(--primary); }

.submit-btn { width: 100%; background: var(--primary); color: white; padding: 20px; font-size: 1.3rem; border: none; border-radius: 12px; font-family: 'Tiro Bangla', serif; font-weight: 800; cursor: pointer; margin-top: 20px; transition: 0.3s; box-shadow: 0 6px 20px rgba(26,122,74,0.3); }
.submit-btn:hover { background: var(--primary-hover); transform: translateY(-3px); }

.result-wrap { background: white; border-radius: 20px; padding: 3rem 2rem; text-align: center; border: 2px solid var(--border-color); display: none; margin: 2rem auto; box-shadow: 0 15px 40px rgba(26,122,74,0.1); }
.result-wrap.show { display: block; }
.result-score { font-size: 4rem; font-weight: 900; color: var(--primary); }
.result-total { font-size: 1.2rem; color: var(--text-meta); font-family: 'Tiro Bangla', serif; font-weight: bold; margin-bottom: 2rem; }
.result-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
.result-bar { background: var(--bg-main); border-radius: 16px; padding: 1.5rem 1rem; border: 1px solid var(--border-color); }
.rb-num { font-size: 2.5rem; font-weight: 900; }
.rb-label { font-family: 'Tiro Bangla', serif; font-size: 1rem; color: var(--text-meta); font-weight: bold; }
</style>
</head>
<body>

<nav class="navbar">
<div class="logo" onclick="window.location.href='../index.html'">Test<span>Bazar</span></div>
<button class="back-btn" onclick="window.location.href='../index.html'">← ফিরে যান</button>
</nav>

<div class="container">
    <div class="header-banner">
        <div class="header-banner-left">
            <h1>🔥 Daily Challenge</h1>
            <p>📅 23 July 2026 · সম্পূর্ণ ফ্রি</p>
        </div>
        <div class="q-count">📝 20 প্রশ্ন</div>
    </div>

    <div id="qList"></div>

    <button class="submit-btn" id="submitBtn" onclick="submitQuiz()">✅ Submit করুন</button>

    <div class="result-wrap" id="resultWrap">
        <div style="font-size: 5rem; margin-bottom: 1rem;" id="resultIcon">🏆</div>
        <div class="result-score" id="finalScore">0</div>
        <div class="result-total" id="resultTotalLabel">মোট প্রাপ্ত নম্বর</div>
        <div class="result-bars">
            <div class="result-bar">
                <div class="rb-num" id="rbCorrect" style="color:var(--success)">0</div>
                <div class="rb-label">সঠিক</div>
            </div>
            <div class="result-bar">
                <div class="rb-num" id="rbWrong" style="color:var(--danger)">0</div>
                <div class="rb-label">ভুল</div>
            </div>
        </div>
        <button class="submit-btn" onclick="location.reload()" style="background: var(--accent); color: var(--primary);">🔄 আবার চেষ্টা করুন</button>
    </div>
</div>

<script>
const questionsData = [
    { q: "১. 'পর্ণমোচী উদ্ভিদ' বলতে কী বোঝায়?", opts: ["যে উদ্ভিদের পাতা সারা বছর থাকে", "যে উদ্ভিদ নির্দিষ্ট ঋতুতে পাতা ঝরিয়ে দেয়", "যে উদ্ভিদ জলে জন্মায়", "যে উদ্ভিদ শুধু মরুভূমিতে জন্মায়"], ans: 1, tag: "Life Science", exp: "পর্ণমোচী উদ্ভিদ নির্দিষ্ট ঋতুতে, বিশেষত শুষ্ক বা শীতল সময়ে, তাদের পুরনো পাতা ঝরিয়ে দেয়। যেমন—শাল, সেগুন ইত্যাদি।" },
    { q: "২. 25-এর 20% কত?", opts: ["4", "5", "10", "20"], ans: 1, tag: "Math", exp: "25-এর 20% = 25 × 20/100 = 5।" },
    { q: "৩. সালোকসংশ্লেষে উদ্ভিদ কোন গ্যাস গ্রহণ করে?", opts: ["অক্সিজেন", "নাইট্রোজেন", "কার্বন ডাই-অক্সাইড", "হাইড্রোজেন"], ans: 2, tag: "Life Science", exp: "সবুজ উদ্ভিদ সূর্যালোকের উপস্থিতিতে কার্বন ডাই-অক্সাইড ও জল ব্যবহার করে খাদ্য তৈরি করে।" },
    { q: "৪. ভারতের সংবিধান কবে কার্যকর হয়?", opts: ["15 আগস্ট 1947", "26 জানুয়ারি 1950", "26 নভেম্বর 1949", "2 অক্টোবর 1950"], ans: 1, tag: "Polity", exp: "ভারতের সংবিধান 26 নভেম্বর 1949 গৃহীত হয় এবং 26 জানুয়ারি 1950 কার্যকর হয়।" },
    { q: "৫. 'He goes to school every day.'—এখানে 'goes' কোন Tense?", opts: ["Simple Past", "Present Continuous", "Simple Present", "Present Perfect"], ans: 2, tag: "English", exp: "নিয়মিত বা অভ্যাসগত কাজ বোঝাতে Simple Present Tense ব্যবহৃত হয়।" },
    { q: "৬. একটি বস্তুর ভর 5 kg এবং ত্বরণ 2 m/s² হলে বল কত?", opts: ["2 N", "5 N", "7 N", "10 N"], ans: 3, tag: "Physics", exp: "F = ma = 5 × 2 = 10 N।" },
    { q: "৭. ভারতের বৃহত্তম মরুভূমির নাম কী?", opts: ["সাহারা", "গোবি", "থর", "কালাহারি"], ans: 2, tag: "Geography", exp: "ভারতের উত্তর-পশ্চিম অংশে অবস্থিত থর মরুভূমি ভারতের বৃহত্তম মরুভূমি।" },
    { q: "৮. 'বিদ্রোহী' কবিতার রচয়িতা কে?", opts: ["রবীন্দ্রনাথ ঠাকুর", "কাজী নজরুল ইসলাম", "জীবনানন্দ দাশ", "মাইকেল মধুসূদন দত্ত"], ans: 1, tag: "Art & Culture", exp: "কাজী নজরুল ইসলাম রচিত 'বিদ্রোহী' বাংলা সাহিত্যের অন্যতম বিখ্যাত কবিতা।" },
    { q: "৯. মানুষের রক্তে অক্সিজেন বহন করে কোন উপাদান?", opts: ["প্লেটলেট", "হিমোগ্লোবিন", "প্লাজমা", "শ্বেত রক্তকণিকা"], ans: 1, tag: "Life Science", exp: "লোহিত রক্তকণিকায় থাকা হিমোগ্লোবিন অক্সিজেনের সঙ্গে যুক্ত হয়ে শরীরের বিভিন্ন অংশে অক্সিজেন পৌঁছে দেয়।" },
    { q: "১০. 2 : 3 অনুপাতে দুটি সংখ্যার যোগফল 25 হলে বড় সংখ্যাটি কত?", opts: ["10", "12", "15", "18"], ans: 2, tag: "Math", exp: "মোট অংশ = 5। প্রতি অংশ = 5। বড় = 3 × 5 = 15।" },
    { q: "১১. বৈদ্যুতিক ক্ষমতার SI একক কী?", opts: ["জুল", "ওয়াট", "ভোল্ট", "অ্যাম্পিয়ার"], ans: 1, tag: "Physics", exp: "বৈদ্যুতিক ক্ষমতার SI একক ওয়াট। 1 ওয়াট = 1 জুল/সেকেন্ড।" },
    { q: "১২. ভারতের দীর্ঘতম নদী কোনটি?", opts: ["গঙ্গা", "গোদাবরী", "নর্মদা", "কৃষ্ণা"], ans: 0, tag: "Geography", exp: "ভারতের ভূখণ্ডের মধ্যে প্রবাহের দৈর্ঘ্যের দিক থেকে গঙ্গা অন্যতম দীর্ঘতম।" },
    { q: "১৩. 'Water' শব্দটির বাংলা অর্থ কী?", opts: ["আগুন", "জল", "মাটি", "বাতাস"], ans: 1, tag: "English", exp: "Water = জল/পানি।" },
    { q: "১৪. মানুষের হৃদপিণ্ডে মোট কয়টি প্রকোষ্ঠ থাকে?", opts: ["2টি", "3টি", "4টি", "5টি"], ans: 2, tag: "Life Science", exp: "মানুষের হৃদপিণ্ডে ৪টি প্রকোষ্ঠ থাকে—দুটি অলিন্দ ও দুটি নিলয়।" },
    { q: "১৫. 0.75-কে ভগ্নাংশে প্রকাশ করলে কত হবে?", opts: ["1/2", "2/3", "3/4", "4/5"], ans: 2, tag: "Math", exp: "0.75 = 75/100 = 3/4।" },
    { q: "১৬. ভারতের প্রথম স্বাধীনতা সংগ্রাম সাধারণত কোন সালে সংঘটিত হয়?", opts: ["1757", "1857", "1885", "1942"], ans: 1, tag: "History", exp: "1857 সালের বিদ্রোহকে ভারতের প্রথম স্বাধীনতা সংগ্রাম বলা হয়।" },
    { q: "১৭. শব্দ কোন মাধ্যমে চলতে পারে না?", opts: ["বায়ু", "জল", "লোহা", "শূন্যস্থান"], ans: 3, tag: "Physics", exp: "শব্দ একটি যান্ত্রিক তরঙ্গ, শূন্যস্থানে চলতে পারে না।" },
    { q: "১৮. ভারতের মান সময় নির্ধারণে কোন দ্রাঘিমারেখা ব্যবহৃত হয়?", opts: ["0°", "66°30′ পূর্ব", "82°30′ পূর্ব", "90° পূর্ব"], ans: 2, tag: "Geography", exp: "IST = 82°30′ পূর্ব দ্রাঘিমারেখা।" },
    { q: "১৯. উদ্ভিদের কোন অংশ প্রধানত জল ও খনিজ লবণ শোষণ করে?", opts: ["পাতা", "ফুল", "মূল", "ফল"], ans: 2, tag: "Life Science", exp: "মূলের মূলরোম মাটি থেকে জল ও খনিজ শোষণ করে।" },
    { q: "২০. যদি x + 7 = 15 হয়, তাহলে x-এর মান কত?", opts: ["6", "7", "8", "9"], ans: 2, tag: "Math", exp: "x = 15 − 7 = 8।" }
];

const LABELS = ['A', 'B', 'C', 'D'];
let userAnswers = {};

function renderQuestions() {
    const container = document.getElementById('qList');
    container.innerHTML = '';
    questionsData.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'q-card';
        let optsHtml = '';
        q.opts.forEach((o, oIdx) => {
            optsHtml += `
            <label class="opt" id="opt_${idx}_${oIdx}" onclick="selectAns(${idx}, ${oIdx})">
                <div class="opt-circle">${LABELS[oIdx]}</div>
                <div class="opt-text">${o}</div>
            </label>`;
        });
        card.innerHTML = `
            <div class="q-num"><span>প্রশ্ন ${idx + 1} / ${questionsData.length}</span> <span class="q-tag">${q.tag}</span></div>
            <div class="q-text">${q.q}</div>
            <div class="opts">${optsHtml}</div>
            <div class="explanation" id="exp_${idx}">
                <p><strong>সঠিক উত্তর:</strong> (${LABELS[q.ans]}) ${q.opts[q.ans]}</p>
                <p style="margin-top:8px;"><strong>ব্যাখ্যা:</strong> ${q.exp}</p>
            </div>
        `;
        container.appendChild(card);
    });
}

function selectAns(qIdx, oIdx) {
    userAnswers[qIdx] = oIdx;
    for(let i=0; i<4; i++) {
        let el = document.getElementById(`opt_${qIdx}_${i}`);
        if(el) el.classList.remove('selected');
    }
    document.getElementById(`opt_${qIdx}_${oIdx}`).classList.add('selected');
}

function submitQuiz() {
    if(Object.keys(userAnswers).length < questionsData.length) {
        if(!confirm("আপনি সব প্রশ্নের উত্তর দেননি! সত্যিই কি Submit করতে চান?")) return;
    }
    let score = 0;
    questionsData.forEach((q, i) => { if(userAnswers[i] === q.ans) score++; });

    questionsData.forEach((q, idx) => {
        const correctAns = q.ans;
        const userAns = userAnswers[idx];
        const inputs = document.querySelectorAll(`#opt_${idx}_0, #opt_${idx}_1, #opt_${idx}_2, #opt_${idx}_3`);
        inputs.forEach(el => el.style.pointerEvents = 'none');
        document.getElementById(`opt_${idx}_${correctAns}`).classList.add('correct');
        if (userAns !== undefined && userAns !== correctAns) {
            document.getElementById(`opt_${idx}_${userAns}`).classList.add('wrong');
        }
        document.getElementById(`exp_${idx}`).classList.add('show');
    });

    document.getElementById('submitBtn').style.display = 'none';
    document.getElementById('resultWrap').classList.add('show');
    document.getElementById('finalScore').innerText = `${score}/${questionsData.length}`;
    document.getElementById('resultTotalLabel').innerText = `মোট প্রাপ্ত নম্বর (Total: ${questionsData.length})`;
    document.getElementById('rbCorrect').innerText = score;
    document.getElementById('rbWrong').innerText = questionsData.length - score;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuestions();
</script>
</body>
</html>
